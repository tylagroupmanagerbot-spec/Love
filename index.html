<!DOCTYPE html>
<html>
<head><title>Baldwin iv x sultan Saladi Bot - Pair</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center;padding:30px}.box{background:#1e1e1e;padding:20px;border-radius:15px;max-width:400px;margin:auto}input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px}button{padding:12px 25px;background:#d4a017;border:none;border-radius:8px;font-weight:bold;cursor:pointer}h1{color:#d4a017}#code{font-size:32px;letter-spacing:5px;margin:20px;color:#ffd700}</style>
</head>
<body>
<h1>⚔️ Baldwin iv x sultan Saladi Bot</h1>
<div class="box">
<p>Owner: Simon tech inc<br>09166265317</p>
<input id="num" value="2349166265317" />
<button onclick="getCode()">Get 8-Digit Code</button>
<div id="code">---- ----</div>
<p id="status">Bot starting...</p>
<p>WhatsApp > Linked Devices > Link with phone number</p>
</div>
<script>
async function getCode(){
  const number=document.getElementById('num').value
  const r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number})})
  const d=await r.json()
  document.getElementById('code').innerText=d.code||d.error
}
setInterval(async()=>{
  const r=await fetch('/code');const d=await r.json();
  if(d.code) document.getElementById('code').innerText=d.code
  document.getElementById('status').innerText=d.connected?"✅ Connected":"⏳ Waiting"
},3000)
</script>
</body>
</html>
